<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" rx="16" fill="#0f172a"/>
  <text x="450" y="42" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="600">How Trigger Doctor works</text>
  <text x="450" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">one pass, five steps — the scanner finds candidates, judgment does the rewriting</text>

  <!-- step boxes -->
  <g font-size="13">
    <rect x="20"  y="100" width="150" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="95"  y="128" text-anchor="middle" fill="#38bdf8" font-size="22">&#128269;</text>
    <text x="95"  y="152" text-anchor="middle" fill="#f1f5f9" font-weight="600">1. SCAN</text>
    <text x="95"  y="172" text-anchor="middle" fill="#94a3b8" font-size="11">walk the skills dir,</text>
    <text x="95"  y="186" text-anchor="middle" fill="#94a3b8" font-size="11">10 structural checks</text>

    <rect x="195" y="100" width="150" height="120" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="270" y="128" text-anchor="middle" fill="#f472b6" font-size="22">&#9888;</text>
    <text x="270" y="152" text-anchor="middle" fill="#f1f5f9" font-weight="600">2. DETECT</text>
    <text x="270" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">rank findings by real</text>
    <text x="270" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">usage from .usage.json</text>

    <rect x="370" y="100" width="150" height="120" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="445" y="128" text-anchor="middle" fill="#fbbf24" font-size="22">&#128064;</text>
    <text x="445" y="152" text-anchor="middle" fill="#f1f5f9" font-weight="600">3. REVIEW</text>
    <text x="445" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">read every flagged</text>
    <text x="445" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">body — no blind edits</text>

    <rect x="545" y="100" width="150" height="120" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="620" y="128" text-anchor="middle" fill="#34d399" font-size="22">&#9998;</text>
    <text x="620" y="152" text-anchor="middle" fill="#f1f5f9" font-weight="600">4. REWRITE</text>
    <text x="620" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">trigger-first, in the</text>
    <text x="620" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">user's own vocabulary</text>

    <rect x="720" y="100" width="160" height="120" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="800" y="128" text-anchor="middle" fill="#a78bfa" font-size="22">&#9989;</text>
    <text x="800" y="152" text-anchor="middle" fill="#f1f5f9" font-weight="600">5. VERIFY</text>
    <text x="800" y="172" text-anchor="middle" fill="#94a3b8" font-size="11">re-scan: 0 hard,</text>
    <text x="800" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">catalog shows enabled</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="#64748b">
    <line x1="170" y1="160" x2="190" y2="160"/><polygon points="190,155 198,160 190,165" stroke="none"/>
    <line x1="345" y1="160" x2="365" y2="160"/><polygon points="365,155 373,160 365,165" stroke="none"/>
    <line x1="520" y1="160" x2="540" y2="160"/><polygon points="540,155 548,160 540,165" stroke="none"/>
    <line x1="695" y1="160" x2="715" y2="160"/><polygon points="715,155 723,160 715,165" stroke="none"/>
  </g>

  <text x="450" y="262" text-anchor="middle" fill="#64748b" font-size="12">Scanner: stdlib-only Python, works standalone. Steps 3&#8211;5 are agent (or human) judgment guided by the SKILL.md.</text>
</svg>
